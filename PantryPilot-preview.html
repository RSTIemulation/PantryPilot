function reviewRow(x,i){return `<div class="review-row" data-row="${i}"><input class="field" aria-label="Item ${i+1} name" data-review="name" data-idx="${i}" value="${esc(x.name)}" maxlength="90"><input class="field" type="number" min="0.01" step="any" aria-label="Quantity" data-review="qty" data-idx="${i}" value="${esc(x.qty)}"><select class="field" data-review="unit" data-idx="${i}" aria-label="Unit">${UNITS.map(u=>`<option ${u===x.unit?'selected':''}>${esc(u)}</option>`).join('')}</select><button data-action="review-remove" data-idx="${i}" aria-label="Remove row">×</button></div>`;}
function inferCategory(name){return ALIASES.find(a=>a[1].toLowerCase()===String(name).toLowerCase())?.[2]||'Other';}
function identify(raw){const priority=['Peanut butter','Pasta sauce','Canned tomatoes','Black beans','Kidney beans','Vegetable broth','Soy sauce','Mixed vegetables'];for(const name of priority){const a=ALIASES.find(x=>x[1]===name);if(a&&a[0].test(raw))return {name:a[1],category:a[2],emoji:a[3]};}for(const [regex,name,cat,emoji] of ALIASES)if(regex.test(raw))return {name,category:cat,emoji};return null;}
const STOP=/\b(?:SUBTOTAL|TOTAL|TAX|BALANCE|CHANGE|CASH|CREDIT|DEBIT|VISA|MASTERCARD|AMEX|CARD\s*NO|TENDER|AUTH|THANK\s*YOU|SHOPPING|SAVINGS|DISCOUNT|COUPON|POINTS|REWARD|STORE\s*NUMBER|REG\s*\d+|TERMINAL|CASHIER|CUSTOMER|ORDER\s*#|AMOUNT\s*DUE|AMT\s*DUE|TRANSACTION|APPROVED|PAYMENT|PHONE|ADDRESS|EXCHANGE|REFUND|MEMBER|WELCOME|GROCERY\s*RECEIPT|PURCHASE|ITEMS\s*SOLD|SCAN\s*TO|WEB|HTTP)\b/i;
function parseReceipt(text){const lines=String(text||'').split(/\r?\n/),results=[];for(const entry of lines){let raw=entry.trim();if(raw.length<3||STOP.test(raw)||/^[-=*_#\s]+$/.test(raw)||/^\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/.test(raw)||/\d{1,2}:\d{2}\s*(?:AM|PM)?\b/i.test(raw)||/@/.test(raw)||/^\(?\d{3}\)?[- .]\d{3}/.test(raw))continue;
 // Price endings are typical. Still accept recognizable food item lines without prices.
 const match=identify(raw),price=/(?:\$?\d{1,5}[.,]\d{2})\s*[TFNB]?\s*$/i.test(raw);
 if(!match&&!price)continue;
 if(!match && /\b(?:SUPERMARKET|MARKET|WALMART|TARGET|KROGER|COSTCO|SAFEWAY|ALBERTSONS|WAL-GREENS)\b/i.test(raw))continue;
 let cleaned=raw.replace(/(?:\$?\d{1,5}[.,]\d{2})\s*[TFNB]?\s*$/i,'').replace(/^\d{4,15}\s+/, '').replace(/\b\d{6,14}\b/g,'').replace(/\b(?:F|N|T|B)\s*$/,'').trim();
 let amount=1,unit='ea';const count=cleaned.match(/\b(\d+(?:\.\d+)?)\s*(CT|COUNT|PK|PCS|EA|DZ|DOZ|LB|LBS|OZ|GAL|QT|PT|KG|ML|LTR|LITER|LITRE)\b/i);
 if(count){amount=Number(count[1]);let label=count[2].toUpperCase();unit=({CT:'ea',COUNT:'ea',PK:'pack',PCS:'ea',EA:'ea',DZ:'dozen',DOZ:'dozen',LB:'lb',LBS:'lb',OZ:'oz',GAL:'gal',QT:'qt',PT:'pt',KG:'kg',ML:'ml',LTR:'L',LITER:'L',LITRE:'L'})[label];}
 else if(/\b(?:CAN|TIN)\b/i.test(cleaned))unit='can';else if(/\b(?:BAG|LOAF|BOX|JAR|PKG|BOTTLE|BTL|BUNCH)\b/i.test(cleaned))unit=/\bBAG\b/i.test(cleaned)?'bag':/\bBOX\b/i.test(cleaned)?'box':/\bBOTTLE|BTL\b/i.test(cleaned)?'bottle':/\bBUNCH\b/i.test(cleaned)?'bunch':'ea';
 // Some grocers prefix "2 X" or "2 @" to the description.
 const prefix=cleaned.match(/^\s*(\d{1,2})\s*[xX]\s+/);if(prefix){amount*=Number(prefix[1]);}
 const known=match||identify(cleaned);
 if(!known){cleaned=cleaned.replace(/\b\d+(?:[.,]\d+)?\s*(?:CT|COUNT|LB|LBS|OZ|PKG|EA|PK|PCS)\b/ig,'').replace(/^\d+\s+/,'').replace(/\s+\d+$/,'').replace(/[^\p{L}\p{N} '’-]/gu,' ').replace(/\s+/g,' ').trim();if(cleaned.length<3||!/[a-z]{3}/i.test(cleaned)||cleaned.length>65)continue;}
 const name=known?.name||pretty(cleaned.toLowerCase());const category=known?.category||'Other';const emoji=known?.emoji||ICONS[category];if(!Number.isFinite(amount)||amount<=0||amount>100000)amount=1;
 const existing=results.find(p=>normalize(p.name)===normalize(name)&&p.unit===unit);if(existing)existing.qty+=amount;else results.push({name,qty:amount,unit,category,emoji});
 }return results.slice(0,90);}
function addInventory(items){let added=0;for(const it of items){const qty=Number(it.qty);const name=String(it.name||'').trim();if(!name||!Number.isFinite(qty)||qty<=0)continue;let unit=UNITS.includes(it.unit)?it.unit:'ea',cat=CATEGORIES.includes(it.category)?it.category:inferCategory(name);let existing=data.inventory.find(p=>normalize(p.name)===normalize(name)&&p.unit===unit&&p.expiry===(it.expiry||''));if(existing){existing.qty=+(existing.qty+qty).toFixed(3);existing.addedAt=new Date().toISOString();}else{data.inventory.push({id:makeId(),name,qty,unit,category:cat,emoji:getEmoji(name,cat),expiry:it.expiry||'',addedAt:new Date().toISOString()});}added++;}save();return added;}
function addShopping(name,qty=1,unit='ea',fromRecipe=''){const existing=data.shopping.find(p=>!p.done&&normalize(p.name)===normalize(name)&&p.unit===unit);if(existing)existing.qty=Math.max(existing.qty,qty);else data.shopping.push({id:makeId(),name,qty,unit,fromRecipe,done:false});save();}
function parseText(text){reviewOriginal=text;reviewItems=parseReceipt(text);imageData='';openModal('review');if(!reviewItems.length)notify('No clear items found. You can add them manually in the review.');}

function loadOcr(){return new Promise((resolve,reject)=>{if(window.Tesseract)return resolve(window.Tesseract);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('OCR library did not load'));s.onerror=()=>reject(new Error('Could not download OCR engine. Check your internet connection.'));document.head.appendChild(s);});}
async function optimizeImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image;img.onload=()=>{try{const max=1750,scale=Math.min(1,max/Math.max(img.width,img.height));const can=document.createElement('canvas');can.width=Math.max(1,Math.round(img.width*scale));can.height=Math.max(1,Math.round(img.height*scale));const ctx=can.getContext('2d',{willReadFrequently:false});ctx.fillStyle='white';ctx.fillRect(0,0,can.width,can.height);ctx.drawImage(img,0,0,can.width,can.height);const str=can.toDataURL('image/jpeg',.85);URL.revokeObjectURL(url);resolve(str);}catch(e){URL.revokeObjectURL(url);reject(e);}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Unable to open this photo.'));};img.src=url;});}
async function scanFile(file){if(!file||!file.type.startsWith('image/')){notify('Please select a receipt image.');return;}if(scanBusy)return;scanBusy=true;modal={type:'busy'};scanPct=.03;scanStatus='Preparing the photo...';imageData='';renderModal();let worker;try{imageData=await optimizeImage(file);scanStatus='Loading the text recognition engine...';scanPct=.10;renderModal();const Tess=await loadOcr();worker=await Tess.createWorker('eng',1,{logger:e=>{if(e.status){scanStatus=e.status==='recognizing text'?'Reading grocery lines...':pretty(e.status);if(typeof e.progress==='number')scanPct=.25+Math.max(0,Math.min(1,e.progress))*.7;renderModal();}}});scanStatus='Reading grocery lines...';renderModal();const result=await worker.recognize(imageData);reviewOriginal=result.data.text||'';reviewItems=parseReceipt(reviewOriginal);modal={type:'review'};if(!reviewItems.length)notify('No items recognized. Try a sharper photo or add rows manually.');}
 catch(e){console.error('Receipt scanning error:',e);modal={type:'scan'};setTimeout(()=>notify(e?.message||'Unable to scan image; paste the receipt text instead.'),20);}
 finally{if(worker){try{await worker.terminate();}catch(e){}}scanBusy=false;renderModal();}}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function movePage(next){page=next;modal=null;render();window.scrollTo?.(0,0);}
function handleAction(btn){const action=btn.dataset.action,id=btn.dataset.id;switch(action){case 'go':movePage(btn.dataset.page);break;case 'scan':showScan();break;case 'take-photo':document.querySelector('#camera-input').click();break;case 'choose-photo':document.querySelector('#photo-input').click();break;case 'close':closeModal();break;case 'sample':reviewOriginal=RECEIPT_SAMPLE;reviewItems=parseReceipt(RECEIPT_SAMPLE);imageData='';openModal('review');break;case 'parse-text':{const value=document.querySelector('#receipt-text')?.value||'';if(!value.trim())return notify('Paste a receipt or select a photo first.');parseText(value);break;}case 'back-scan':openModal('scan');break;case 'review-add':reviewItems.push({name:'',qty:1,unit:'ea',category:'Other',emoji:'🛒'});renderModal();break;case 'review-remove':reviewItems.splice(Number(btn.dataset.idx),1);renderModal();break;case 'save-review':{
 const items=reviewItems.filter(x=>x.name.trim()&&Number(x.qty)>0);if(!items.length)return notify('Add at least one grocery with a name and quantity.');const amount=addInventory(items);data.receipts.unshift({id:makeId(),label:imageData?'Photo scan':'Receipt text / sample',at:new Date().toISOString(),count:amount});data.receipts=data.receipts.slice(0,30);save();closeModal();page='pantry';render();notify(`${amount} grocery item${amount===1?'':'s'} added to your pantry!`);break;}
 case 'category':category=btn.dataset.val;render();break;case 'clear-search':category='All';pantrySearch='';render();break;case 'add-item':openModal('item',{});break;case 'edit-item':openModal('item',{id});break;case 'inc-item':case 'dec-item':{const p=data.inventory.find(x=>x.id===id);if(!p)break;const steps={lb:.25,oz:1,kg:.25,g:25,cup:.25,tbsp:1,tsp:1,gal:.25,qt:.25,pt:.25,'fl oz':1,ml:50,L:.25};const step=steps[p.unit]||1;if(action==='dec-item'&&p.qty<=step){data.inventory=data.inventory.filter(x=>x.id!==id);notify(`${p.name} removed from pantry`);}else p.qty=+Math.max(0,p.qty+(action==='inc-item'?step:-step)).toFixed(3);save();render();break;}
 case 'save-item':{const name=document.querySelector('#item-name').value.trim(),qty=Number(document.querySelector('#item-qty').value),unit=document.querySelector('#item-unit').value,cat=document.querySelector('#item-cat').value,expiry=document.querySelector('#item-expiry').value;if(!name||!Number.isFinite(qty)||qty<=0||qty>100000)return notify('Enter a valid grocery name and positive quantity.');const it=modal.id?data.inventory.find(x=>x.id===modal.id):null;if(it){Object.assign(it,{name,qty,unit,category:cat,expiry,emoji:getEmoji(name,cat)});save();}else addInventory([{name,qty,unit,category:cat,expiry}]);closeModal();render();notify('Pantry item saved');break;}
 case 'delete-item':data.inventory=data.inventory.filter(x=>x.id!==id);save();closeModal();render();notify('Item deleted');break;case 'recipe-filter':recipeFilter=btn.dataset.val;render();break;case 'reset-recipes':recipeSearch='';readyOnly=false;recipeFilter='All';render();break;
 case 'fav':{const i=data.favorites.indexOf(id);if(i===-1)data.favorites.push(id);else data.favorites.splice(i,1);save();render();break;}
 case 'recipe':openModal('recipe',{id});break;case 'recipe-shop':{const r=R.find(x=>x.id===id);let count=0;for(const ing of r.ingredients)if(!['yes','unknown'].includes(ingredientState(ing))){addShopping(ing.name,ing.qty,ing.unit,r.name);count++;}if(count)notify(`${count} missing ingredient${count===1?'':'s'} added to your list`);else notify('All ingredients appear to be in your pantry!');renderModal();break;}
 case 'cook':openModal('confirm-cook',{id});break;case 'confirm-cook':{const r=R.find(x=>x.id===id);let changed=0;for(const ing of r.ingredients){let need=ing.qty*(U[ing.unit]?.[1]||1);const candidates=data.inventory.filter(p=>normalize(p.name)===normalize(ing.name)&&p.qty>0&&U[p.unit]&&U[ing.unit]&&U[p.unit][0]===U[ing.unit][0]);const total=candidates.reduce((sum,p)=>sum+p.qty*U[p.unit][1],0);if(total+1e-6<need)continue;for(const p of candidates){const avail=p.qty*U[p.unit][1],used=Math.min(avail,need);p.qty=+Math.max(0,(avail-used)/U[p.unit][1]).toFixed(4);need-=used;if(used>0)changed++;if(need<=1e-7)break;}}
 data.inventory=data.inventory.filter(x=>x.qty>0.0001);save();closeModal();render();notify(changed?`Meal logged — updated ${changed} pantry entr${changed===1?'y':'ies'}.`:'Meal logged. Check pantry quantities manually.');break;}
 case 'remove-shop':data.shopping=data.shopping.filter(x=>x.id!==id);save();render();break;case 'shop-to-pantry':{const checked=data.shopping.filter(x=>x.done);const count=addInventory(checked.map(x=>({name:x.name,qty:x.qty,unit:x.unit})));data.shopping=data.shopping.filter(x=>!x.done);save();render();notify(`${count} items moved to your pantry. Check package amounts.`);break;}
 case 'copy-shopping':{const text=data.shopping.filter(x=>!x.done).map(x=>`☐ ${x.name} (${fmtQty(x.qty,x.unit)})`).join('\n')||'Shopping list is empty';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>notify('Shopping list copied')).catch(()=>{download('shopping-list.txt',text,'text/plain');notify('Shopping list saved');});else{download('shopping-list.txt',text,'text/plain');notify('Shopping list saved');}break;}
 case 'export':download(`pantrypilot-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(data,null,2),'application/json');notify('Backup downloaded');break;case 'import':document.querySelector('#backup-input').click();break;case 'clear-data':openModal('confirm-clear');break;case 'confirm-clear':data=initial();save();closeModal();page='home';render();notify('Pantry data cleared');break;
 }}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){e.preventDefault();handleAction(btn);}else if(e.target.matches('[data-overlay]'))closeModal();});
document.addEventListener('input',e=>{if(e.target.matches('[data-review]')){const x=reviewItems[Number(e.target.dataset.idx)];if(x){const key=e.target.dataset.review;x[key]=key==='qty'?Number(e.target.value):e.target.value;if(key==='name'){const known=identify(x.name);if(known)Object.assign(x,{category:known.category,emoji:known.emoji});}}return;}if(e.target.id==='pantry-search'||e.target.id==='recipe-search'){const sel=e.target.selectionStart,value=e.target.value,id=e.target.id;if(id==='pantry-search')pantrySearch=value;else recipeSearch=value;render();const restored=document.querySelector('#'+id);if(restored){restored.focus();try{restored.setSelectionRange(sel,sel);}catch(err){}}}});
document.addEventListener('change',e=>{if(e.target.id==='ready-toggle'){readyOnly=e.target.checked;render();}const shopId=e.target.dataset.shopCheck;if(shopId){const x=data.shopping.find(x=>x.id===shopId);if(x)x.done=e.target.checked;save();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='shop-add'){e.preventDefault();const el=document.querySelector('#shop-name'),name=el?.value.trim();if(name){addShopping(name);render();notify(`${name} added to shopping list`);}}if(e.target.id==='item-form'){e.preventDefault();handleAction({dataset:{action:'save-item'}});}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&!scanBusy)closeModal();});
for(const inputId of ['camera-input','photo-input'])document.querySelector('#'+inputId).addEventListener('change',e=>{const file=e.target.files?.[0];if(file)scanFile(file);e.target.value='';});
document.querySelector('#backup-input').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.inventory)||!Array.isArray(v.shopping)||!Array.isArray(v.receipts)||!Array.isArray(v.favorites))throw Error('Not a PantryPilot backup.');if(!confirm('Replace all data on this device with the selected backup?'))return;data={...initial(),...v};save();page='home';render();notify('Backup restored');}catch(err){notify('Unable to read this backup file.');}});
if('serviceWorker'in navigator && window.location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.PantryPilotTest={parseReceipt,coverage,compareUnits,RECEIPT_SAMPLE,recipes:R,getData:()=>data};
render();
})();
