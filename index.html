<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#214b39">
  <meta name="description" content="Turn grocery receipts into a pantry inventory and meals you can make.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PantryPilot — Scan. Stock. Cook.</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="photo-input" type="file" accept="image/*" hidden>
  <input id="backup-input" type="file" accept="application/json,.json" hidden>
</body>
</html>
